<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panel Docente — 6°3ra Computación</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    /* Mismos estilos que tenías, están perfectos. Solo achico el bloque para no hacer spam visual */
    :root { --bg: #0a0e1a; --bg2: #111827; --bg3: #1a2235; --accent: #3b82f6; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; --text: #f1f5f9; --text2: #94a3b8; --border: rgba(255,255,255,0.08); --radius: 16px; --radius-sm: 10px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; padding: 0 0 60px; }
    .header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 12px; justify-content: space-between;}
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-icon { width: 36px; height: 36px; background: var(--warning); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .header-icon svg { width: 20px; height: 20px; fill: white; }
    .header h1 { font-size: 16px; font-weight: 600; }
    .header p { font-size: 12px; color: var(--text2); }
    .curso-badge { background: var(--accent); color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px 24px; width: min(520px, calc(100% - 32px)); margin: 24px auto; }
    .card-title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text2); margin-bottom: 20px; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
    input[type=text], input[type=password], select { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 15px; padding: 12px 14px; outline: none; transition: border-color 0.2s; }
    input:focus, select:focus { border-color: var(--accent); }
    .field { margin-bottom: 16px; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-success { background: var(--success); color: white; }
    .alert { border-radius: var(--radius-sm); padding: 12px 14px; font-size: 13px; margin-bottom: 14px; display: none; }
    .alert-danger { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
    #qr-display { background: white; border-radius: var(--radius); padding: 20px; text-align: center; margin: 20px 0; position: relative; }
    #qr-display canvas, #qr-display img { margin: 0 auto; }
    .qr-info { background: var(--bg3); border-radius: var(--radius-sm); padding: 14px; margin-top: 16px; }
    .qr-info-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; }
    .countdown-ring { position: relative; display: inline-flex; align-items: center; justify-content: center; margin: 8px 0; }
    .countdown-ring svg { transform: rotate(-90deg); }
    .countdown-ring .ring-bg { fill: none; stroke: var(--bg3); stroke-width: 6; }
    .countdown-ring .ring-fill { fill: none; stroke: var(--success); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 1s linear, stroke 0.3s; }
    .countdown-ring .label { position: absolute; font-size: 22px; font-weight: 700; }
    .expired-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.8); border-radius: var(--radius); display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
    .expired-overlay span { font-size: 18px; font-weight: 700; color: var(--danger); }
    .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
    .stat-card { background: var(--bg3); border-radius: var(--radius-sm); padding: 12px; text-align: center; }
    .stat-num { font-size: 24px; font-weight: 700; }
    .stat-label { font-size: 11px; color: var(--text2); margin-top: 2px; }
    .attendance-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 16px; }
    .attendance-table th { text-align: left; padding: 8px 10px; font-size: 11px; font-weight: 600; color: var(--text2); border-bottom: 1px solid var(--border); }
    .attendance-table td { padding: 10px; border-bottom: 1px solid var(--border); }
    .badge-ok { background: rgba(16,185,129,0.15); color: #10b981; padding: 2px 7px; border-radius: 20px; font-size: 11px; }
  </style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <div class="header-icon">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
    </div>
    <div>
      <h1>Panel Docente</h1>
      <p>Sistema de asistencia digital</p>
    </div>
  </div>
  <div class="curso-badge">6°3ra Computación</div>
</div>

<!-- LOGIN -->
<div class="card" id="login-screen">
  <div class="card-title">🔐 Acceso docente</div>
  <div class="alert alert-danger" id="login-error"></div>
  <div class="field">
    <label>Usuario</label>
    <input type="text" id="login-user" placeholder="usuario_docente"/>
  </div>
  <div class="field">
    <label>Contraseña</label>
    <input type="password" id="login-pass" placeholder="••••••••"/>
  </div>
  <button class="btn btn-primary" onclick="doLogin()">Ingresar al panel</button>
</div>

<!-- PANEL PRINCIPAL -->
<div id="panel-screen" style="display:none;">
  <div class="card">
    <div class="card-title">📋 Configurar clase</div>
    <div class="field">
      <label>Materia</label>
      <input type="text" id="p-materia" placeholder="Ej: Proyecto, Redes, etc."/>
    </div>
    <div class="field">
      <label>Nombre del docente</label>
      <input type="text" id="p-profesor" placeholder="Ej: Prof. González"/>
    </div>
    <button class="btn btn-primary" onclick="generateQR()">Generar QR de clase</button>
  </div>

  <div class="card" id="qr-card" style="display:none;">
    <div class="card-title">🖥️ Mostrá este QR en el pizarrón</div>
    <div style="text-align:center; margin-bottom:12px;">
      <div class="countdown-ring">
        <svg width="80" height="80" viewBox="0 0 80 80">
          <circle class="ring-bg" cx="40" cy="40" r="34"/>
          <circle class="ring-fill" id="ring" cx="40" cy="40" r="34" stroke-dasharray="213.6" stroke-dashoffset="0"/>
        </svg>
        <span class="label" id="countdown-num">90</span>
      </div>
    </div>
    <div id="qr-display">
      <div id="qrcode"></div>
      <div class="expired-overlay" id="exp-overlay">
        <span>⛔ QR EXPIRADO</span>
        <button class="btn btn-primary" onclick="generateQR()" style="width:auto;padding:10px 20px;">Regenerar</button>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;">
      <button class="btn btn-primary" onclick="generateQR()">🔄 Nuevo QR</button>
      <button class="btn btn-success" onclick="autoRenew()">⏱️ Auto-renovar</button>
    </div>
  </div>

  <div class="card" id="asistencia-card" style="display:none;">
    <div class="card-title">📊 Asistencia en tiempo real</div>
    <div class="stats-bar">
      <div class="stat-card"><div class="stat-num" id="s-presentes" style="color:var(--success)">0</div><div class="stat-label">Presentes</div></div>
    </div>
    <button class="btn btn-primary" onclick="refreshStats()" style="margin-top:12px">🔄 Actualizar lista</button>
    <table class="attendance-table" id="att-table">
      <thead><tr>
        <th>Alumno</th><th>PC</th><th>Hora</th><th>Estado</th>
      </tr></thead>
      <tbody id="att-body">
        <tr><td colspan="4" style="text-align:center;color:var(--text2);padding:20px;">Sin registros aún</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
// CONFIGURACIÓN CLAVE
const CFG = {
  SECRET_KEY: "CLAVE_SECRETA_63RA", // La misma que pondremos en Google Apps Script
  APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbywe8sagWaCzXwjCN67oPw6cv3K9DQs18xK3RF93JubiPNojivTincxodzafncfGCu8/exec", // Lo rellenamos en el paso 3
  QR_SECS: 90,
  USERS: { "profe": "1234" } // Contraseña simple de prueba
};

let countdownInterval = null; let autoRenewInterval = null; let currentToken = null; let countdownLeft = 0;

function doLogin() {
  const u = document.getElementById("login-user").value.trim();
  const p = document.getElementById("login-pass").value;
  if (CFG.USERS[u] === p) {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("panel-screen").style.display = "block";
    document.getElementById("asistencia-card").style.display = "block";
  } else {
    document.getElementById("login-error").style.display = "block";
    document.getElementById("login-error").textContent = "Error de acceso.";
  }
}

function simpleSign(data, key) {
  let h = 0;
  for (let i = 0; i < data.length; i++) h = (Math.imul(31, h) + data.charCodeAt(i)) | 0;
  for (let i = 0; i < key.length; i++) h = (Math.imul(37, h) + key.charCodeAt(i)) | 0;
  return (h >>> 0).toString(16);
}

function generateQR() {
  const materia = document.getElementById("p-materia").value || "Materia";
  const profesor = document.getElementById("p-profesor").value || "Docente";
  const ts = Math.floor(Date.now() / 1000);
  const token = ts.toString(36) + Math.random().toString(36).slice(2, 6);
  
  currentToken = { token, materia, profesor, ts };
  
  // 1. Calculamos la firma de seguridad
  const firma = simpleSign(ts + profesor + "6°3ra", CFG.SECRET_KEY);
  
  // 2. Detectamos la URL actual donde está el profe (ya sea localhost o GitHub Pages)
  // Forzamos el enlace directo a tu entorno de producción en GitHub Pages
   const urlBase = "https://joakolionel.github.io/asistencia-6-3ra/index.html";
  
  // 3. Armamos el link final que va a contener el QR con los parámetros de seguridad
  const linkConTokens = `${urlBase}?t=${token}&s=${ts}&g=${firma}`;
  
  const qrDiv = document.getElementById("qrcode");
  qrDiv.innerHTML = "";
  
  // 4. El QR ahora dibuja el LINK REAL, usamos corrección 'M' para que no se desborde
  new QRCode(qrDiv, { 
    text: linkConTokens, 
    width: 260, 
    height: 260, 
    colorDark: "#000000", 
    colorLight: "#ffffff", 
    correctLevel: QRCode.CorrectLevel.M 
  });
  
  document.getElementById("exp-overlay").style.display = "none";
  document.getElementById("qr-card").style.display = "block";
  
  clearInterval(countdownInterval); 
  countdownLeft = CFG.QR_SECS; 
  updateCountdown();
  
  countdownInterval = setInterval(() => {
    countdownLeft--; 
    updateCountdown();
    if (countdownLeft <= 0) { 
      clearInterval(countdownInterval); 
      document.getElementById("exp-overlay").style.display = "flex"; 
    }
  }, 1000);
}

function updateCountdown() {
  document.getElementById("countdown-num").textContent = countdownLeft;
  const ring = document.getElementById("ring");
  const pct = countdownLeft / CFG.QR_SECS;
  ring.style.strokeDashoffset = 213.6 * (1 - pct);
  ring.style.stroke = pct > 0.5 ? "#10b981" : pct > 0.25 ? "#f59e0b" : "#ef4444";
}

function autoRenew() {
  clearInterval(autoRenewInterval);
  autoRenewInterval = setInterval(() => generateQR(), (CFG.QR_SECS) * 1000);
  generateQR();
}

async function refreshStats() {
  if(!CFG.APPS_SCRIPT_URL.includes("script.google.com")) return alert("Falta configurar APPS_SCRIPT_URL");
  try {
    const res = await fetch(CFG.APPS_SCRIPT_URL + "?action=list");
    const records = await res.json();
    document.getElementById("s-presentes").textContent = records.length;
    const tbody = document.getElementById("att-body");
    if (!records.length) return tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text2);padding:20px;">Sin registros</td></tr>';
    
    tbody.innerHTML = records.map(r => `
      <tr>
        <td>${r.alumno}</td>
        <td style="font-family:monospace;font-weight:700">${r.pc}</td>
        <td>${r.hora}</td>
        <td><span class="badge-ok">✓ Presente</span></td>
      </tr>
    `).join("");
  } catch(e) { console.error("Error cargando:", e); }
}
</script>
</body>
</html>
