<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Asistencia - Alumno</title>
  <!-- Librería Tesseract.js para procesamiento OCR local en el celular -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --success: #166534;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 90vh;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    h2 { margin-top: 0; color: #0f172a; font-size: 1.5rem; }
    p { color: #64748b; font-size: 0.95rem; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 0.9rem; }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    input:focus { outline: 2px solid var(--primary); }
    input:read-only { background-color: #f1f5f9; color: #475569; cursor: not-allowed; }
    .btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 10px;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: #475569; }
    .btn-secondary:hover { background: #334155; }
    .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
    .status-msg {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      display: none;
      font-weight: 500;
    }
    .status-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .status-success { background: #dcfce7; color: var(--success); border: 1px solid #86efac; }
    .status-info { background: #e0f2fe; color: #0369a1; border: 1px solid #7dd3fc; }
  </style>
</head>
<body>

<div class="card" id="form-container">
  <h2>Validando acceso...</h2>
  <p>Esperá un momento mientras verificamos los tokens de seguridad.</p>
</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwznn3--nhkBaAp_x2mFDom9lG0FVOnfvQnGC_U5JpiC9sI0MQ2_g5CvLAkzLcBY2bS/exec";

// ── CONSTANTES DE SEGURIDAD ────────────────────────────────
// Debe coincidir con CFG.QR_SECS del panel docente
const QR_VALIDITY_SECS   = 30;
// Radio máximo permitido desde la ubicación del profesor (metros)
const DISTANCIA_MAX_METROS = 300;

let seguridadQR = { t: null, s: null, g: null, lat: null, lon: null };
let numeroPcDetectado = "";

// ── UTILIDADES DE GEOLOCALIZACIÓN ──────────────────────────
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2
    + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function obtenerPosicion() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject({ code: 99, message: "GPS no disponible en este dispositivo." });
      return;
    }
    navigator.geolocation.getCurrentPosition(resolve, reject, {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    });
  });
}

// ── INICIALIZACIÓN CON TODAS LAS VALIDACIONES ──────────────
window.onload = async function () {
  const container = document.getElementById("form-container");

  // --- CONTROL ANTIFRAUDE: Bloqueo dinámico por día ---
  const registroClave = "asistencia_enviada_" + new Date().toISOString().split('T')[0];
  if (localStorage.getItem(registroClave)) {
    container.innerHTML = `
      <h2 style="color: var(--success);">🎉 Registro Finalizado</h2>
      <p>Ya registraste tu presente el día de hoy. El sistema se habilitará automáticamente para la próxima clase la semana que viene.</p>
    `;
    return;
  }

  // Extracción de parámetros de seguridad del QR (ahora incluye lat/lon del profesor)
  const urlParams = new URLSearchParams(window.location.search);
  seguridadQR.t   = urlParams.get('t');
  seguridadQR.s   = urlParams.get('s');
  seguridadQR.g   = urlParams.get('g');
  seguridadQR.lat = urlParams.get('lat');
  seguridadQR.lon = urlParams.get('lon');

  // Si faltan parámetros del QR, denegar acceso
  if (!seguridadQR.t || !seguridadQR.s || !seguridadQR.g || !seguridadQR.lat || !seguridadQR.lon) {
    container.innerHTML = `
      <h2 style="color: #991b1b;">❌ Acceso Denegado</h2>
      <p>Para poder registrar tu presencia tenés que estar en el laboratorio y escanear el código QR dinámico del profesor.</p>
    `;
    return;
  }

  // --- FIX: VALIDACIÓN DE EXPIRACIÓN DEL QR (30 segundos) ---
  const ahora  = Math.floor(Date.now() / 1000);
  const edadQR = ahora - parseInt(seguridadQR.s);
  if (edadQR < 0 || edadQR > QR_VALIDITY_SECS) {
    container.innerHTML = `
      <h2 style="color: #991b1b;">⏱️ QR Expirado</h2>
      <p>El código QR ya no es válido (tenía ${edadQR}s de antigüedad). Pedile al profesor que muestre el nuevo código y volvé a escanearlo.</p>
    `;
    return;
  }

  // --- FIX: VALIDACIÓN DE GEOLOCALIZACIÓN ---
  const profeLat = parseFloat(seguridadQR.lat);
  const profeLon = parseFloat(seguridadQR.lon);

  if (isNaN(profeLat) || isNaN(profeLon)) {
    container.innerHTML = `
      <h2 style="color: #991b1b;">❌ QR Inválido</h2>
      <p>El código QR no contiene datos de ubicación. Pedile al profesor que genere un nuevo QR con el GPS activo.</p>
    `;
    return;
  }

  container.innerHTML = `
    <h2>Verificando ubicación...</h2>
    <p>📍 Necesitamos confirmar que estás presente en el aula. Aceptá el permiso de ubicación cuando te lo pida el navegador.</p>
  `;

  try {
    const pos       = await obtenerPosicion();
    const distancia = haversine(pos.coords.latitude, pos.coords.longitude, profeLat, profeLon);

    if (distancia > DISTANCIA_MAX_METROS) {
      container.innerHTML = `
        <h2 style="color: #991b1b;">📍 Fuera del Aula</h2>
        <p>Estás a <strong>${Math.round(distancia)} metros</strong> del aula. Solo podés registrar tu presencia si estás físicamente en el laboratorio (máximo ${DISTANCIA_MAX_METROS}m).</p>
      `;
      return;
    }

    // ✅ Todas las validaciones pasaron: mostrar formulario
    renderizarFormulario();

  } catch (err) {
    let msgError = "No pudimos obtener tu ubicación. Verificá que el GPS esté activo y recargá la página.";
    if (err.code === 1) msgError = "Denegaste el permiso de ubicación. Habilitá el GPS en tu navegador y recargá la página.";
    else if (err.code === 2) msgError = "No se pudo detectar tu posición GPS. Asegurate de tener el GPS activo.";
    else if (err.code === 3) msgError = "Tiempo agotado al obtener la ubicación. Verificá tu señal GPS y recargá la página.";

    container.innerHTML = `
      <h2 style="color: #991b1b;">📍 Error de Ubicación</h2>
      <p>${msgError}</p>
    `;
  }
};

function renderizarFormulario() {
  const container = document.getElementById("form-container");
  container.innerHTML = `
    <h2>Registro de Asistencia</h2>
    <p>Ingresá tus datos para dar el presente en la materia actual.</p>

    <div class="form-group">
      <label for="alumno-nombre">Nombre y Apellido completo:</label>
      <input type="text" id="alumno-nombre" placeholder="Ej: Juan Pérez">
    </div>

    <div class="form-group">
      <label>Equipo asignado (Captura Requerida):</label>
      <input type="text" id="alumno-pc" placeholder="Hacé clic abajo para tomar foto" readonly>
      <input type="file" id="file-input" accept="image/*" capture="environment" style="display: none;" onchange="procesarFoto(event)">
      <button class="btn btn-secondary" id="btn-foto" onclick="document.getElementById('file-input').click()" style="margin-top: 8px;">📷 Sacar foto al número de PC</button>
    </div>

    <button class="btn" id="btn-enviar" onclick="enviarAsistencia()" disabled>Registrar Presente</button>
    <div id="status-box" class="status-msg"></div>
  `;
}

// ── FIX OCR: PREPROCESAMIENTO DE IMAGEN ───────────────────
// Escala 3x + escala de grises + binarización para maximizar
// la precisión de Tesseract en etiquetas de fondo blanco/texto negro

// Extrae el código de PC del texto OCR (ej: "26A", "11A")
function extraerCodigo(text) {
  const limpio = text.toUpperCase().replace(/\s+/g, '').replace(/[^0-9A-Z]/g, '');
  // Prioriza: 1-3 dígitos + una letra mayúscula (formato estándar de etiquetas)
  const conLetra  = limpio.match(/\d{1,3}[A-Z]/g);
  const soloNum   = limpio.match(/\d{2,3}/g);
  const candidatos = conLetra || soloNum || [];
  return candidatos.find(c => c.length >= 2 && c.length <= 4) || null;
}

// ── MÓDULO OCR: ÚNICO INTENTO DIRECTO PARA EVITAR FALLAS ──
async function procesarFoto(event) {
  const file = event.target.files[0];
  if (!file) return;

  const btnFoto   = document.getElementById("btn-foto");
  const inputPc   = document.getElementById("alumno-pc");
  const btnEnviar = document.getElementById("btn-enviar");

  btnFoto.disabled = true;
  showStatus("⏳ Analizando la foto del equipo... Esperá un momento.", "info");

  let worker = null;
  try {
    // 1. Creamos el worker y cargamos el idioma
    worker = await Tesseract.createWorker('eng');
    
    // 2. Parámetros básicos para leer la etiqueta (letras y números)
    await worker.setParameters({
      tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ',
      tessedit_pageseg_mode: '7' 
    });

    // 3. Único escaneo directo al archivo original
    const { data: { text } } = await worker.recognize(file);
    const codigo = extraerCodigo(text);

    if (codigo) {
      numeroPcDetectado = codigo;
      inputPc.value     = `Equipo Detectado: ${numeroPcDetectado}`;
      showStatus("✅ ¡Código de PC reconocido con éxito!", "success");
      btnEnviar.disabled = false;
    } else {
      throw new Error("Lectura fallida");
    }

  } catch (error) {
    showStatus("⚠️ No se detectó el código. Sacá la foto de nuevo bien de cerca y enfocada (Ej: 26A).", "error");
    inputPc.value      = "";
    btnEnviar.disabled = true;
  } finally {
    if (worker) {
      await worker.terminate(); // Libera la memoria del celular al instante
    }
    btnFoto.disabled = false;
  }
}

// ── ENVÍO DE DATOS Y BLOQUEO DEFINITIVO ───────────────────
async function enviarAsistencia() {
  const nombre    = document.getElementById("alumno-nombre").value.trim();
  const btn       = document.getElementById("btn-enviar");
  const container = document.getElementById("form-container");

  if (!nombre || !numeroPcDetectado) {
    showStatus("⚠️ Datos incompletos. Completá tu nombre y sacá la foto a la etiqueta.", "error");
    return;
  }

  btn.disabled = true;
  showStatus("⏳ Subiendo tu asistencia a la planilla de Google...", "info");

  try {
    const paqueteAsistencia = {
      nombreAlumno: nombre,
      numeroPC:     numeroPcDetectado,
      ts:           seguridadQR.s,
      token:        seguridadQR.t
    };

    // Petición POST al Web App de Google Sheets
    await fetch(APPS_SCRIPT_URL, {
      method:  "POST",
      mode:    "no-cors",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify(paqueteAsistencia)
    });

    // Guardamos el bloqueo diario en el LocalStorage
    const registroClave = "asistencia_enviada_" + new Date().toISOString().split('T')[0];
    localStorage.setItem(registroClave, "true");

    // Limpieza de interfaz: Muestra pantalla de cierre definitiva
    container.innerHTML = `
      <h2 style="color: var(--success);">🎉 Registro Finalizado</h2>
      <p>Tu asistencia fue guardada con éxito en Google Sheets. Ya podés cerrar esta pestaña y comenzar con la clase.</p>
    `;

  } catch (error) {
    showStatus("❌ Error de comunicación con el servidor. Revisá tu conexión e intentá de nuevo.", "error");
    btn.disabled = false;
  }
}

function showStatus(msg, tipo) {
  const box = document.getElementById("status-box");
  if (!box) return;
  box.innerText   = msg;
  box.style.display = "block";
  box.className   = `status-msg status-${tipo}`;
}
</script>

</body>
</html>
