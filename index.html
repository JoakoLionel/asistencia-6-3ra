<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Asistencia - Alumno</title>
  <!-- Librería Tesseract.js para procesamiento OCR local en el celular -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --success: #166534;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 90vh;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    h2 { margin-top: 0; color: #0f172a; font-size: 1.5rem; }
    p { color: #64748b; font-size: 0.95rem; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 0.9rem; }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    input:focus { outline: 2px solid var(--primary); }
    input:read-only { background-color: #f1f5f9; color: #475569; cursor: not-allowed; }
    .btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 10px;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: #475569; }
    .btn-secondary:hover { background: #334155; }
    .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
    .status-msg {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      display: none;
      font-weight: 500;
    }
    .status-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .status-success { background: #dcfce7; color: var(--success); border: 1px solid #86efac; }
    .status-info { background: #e0f2fe; color: #0369a1; border: 1px solid #7dd3fc; }
  </style>
</head>
<body>

<div class="card" id="form-container">
  <h2>Validando acceso...</h2>
  <p>Esperá un momento mientras verificamos los tokens de seguridad.</p>
</div>

<script>
// !!! REEMPLAZÁ ESTA URL CON LA DE TU NUEVA IMPLEMENTACIÓN EN APPS SCRIPT !!!
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbywe8sagWaCzXwjCN67oPw6cv3K9DQs18xK3RF93JubiPNojivTincxodzafncfGCu8/exec"; 

let seguridadQR = { t: null, s: null, g: null };
let numeroPcDetectado = "";

// Al cargar la página, se ejecutan los controles de fecha y parámetros de URL
window.onload = function() {
  const container = document.getElementById("form-container");

  // --- CONTROL ANTIFRAUDE: Bloqueo dinámico por día ---
  // Genera una clave única por día (Ej: 'asistencia_enviada_2026-05-22')
  const registroClave = "asistencia_enviada_" + new Date().toISOString().split('T')[0];
  
  if (localStorage.getItem(registroClave)) {
    container.innerHTML = `
      <h2 style="color: var(--success);">🎉 Registro Finalizado</h2>
      <p>Ya registraste tu presente el día de hoy. El sistema se habilitará automáticamente para la próxima clase la semana que viene.</p>
    `;
    return;
  }

  // Extracción de parámetros de seguridad del QR
  const urlParams = new URLSearchParams(window.location.search);
  seguridadQR.t = urlParams.get('t');
  seguridadQR.s = urlParams.get('s');
  seguridadQR.g = urlParams.get('g');

  // Si no se escaneó el QR correcto o faltan tokens, rebota el acceso
  if (!seguridadQR.t || !seguridadQR.s || !seguridadQR.g) {
    container.innerHTML = `
      <h2 style="color: #991b1b;">❌ Acceso Denegado</h2>
      <p>Para poder registrar tu presencia tenés que estar en el laboratorio y escanear el código QR dinámico del profesor.</p>
    `;
    return;
  }

  // Si está todo OK y no votó hoy, renderiza la interfaz limpia
  container.innerHTML = `
    <h2>Registro de Asistencia</h2>
    <p>Ingresá tus datos para dar el presente en la materia actual.</p>
    
    <div class="form-group">
      <label for="alumno-nombre">Nombre y Apellido completo:</label>
      <input type="text" id="alumno-nombre" placeholder="Ej: Juan Pérez">
    </div>
    
    <div class="form-group">
      <label>Equipo asignado (Captura Requerida):</label>
      <input type="text" id="alumno-pc" placeholder="Hacé clic abajo para tomar foto" readonly>
      <input type="file" id="file-input" accept="image/*" capture="environment" style="display: none;" onchange="procesarFoto(event)">
      <button class="btn btn-secondary" id="btn-foto" onclick="document.getElementById('file-input').click()" style="margin-top: 8px;">📷 Sacar foto al número de PC</button>
    </div>
    
    <button class="btn" id="btn-enviar" onclick="enviarAsistencia()" disabled>Registrar Presente</button>
    <div id="status-box" class="status-msg"></div>
  `;
};

// --- MÓDULO OCR: Procesamiento de imagen y filtrado alfanumérico (Ej: 26A) ---
async function procesarFoto(event) {
  const file = event.target.files[0];
  if (!file) return;

  const btnFoto = document.getElementById("btn-foto");
  const inputPc = document.getElementById("alumno-pc");
  const btnEnviar = document.getElementById("btn-enviar");

  btnFoto.disabled = true;
  showStatus("⏳ Analizando la etiqueta del equipo... Esperá un momento.", "info");

  try {
    // Tesseract procesa la foto localmente en el dispositivo
    const result = await Tesseract.recognize(file, 'eng');
    
    // Normalizamos el texto quitando espacios y pasando a mayúsculas
    const textoExtraido = result.data.text.toUpperCase().replace(/\s+/g, '');
    
    // Expresión regular para detectar números seguidos de letras (como '26A')
    const patronPC = /[0-9]+[A-Z]*/g;
    const coincidencias = textoExtraido.match(patronPC);

    if (coincidencias && coincidencias.length > 0) {
      // Buscamos un código que cumpla con el largo típico de la etiqueta del monitor (entre 2 y 4 caracteres)
      const codigoValido = coincidencias.find(c => c.length >= 2 && c.length <= 4);

      if (codigoValido) {
        numeroPcDetectado = codigoValido;
        inputPc.value = `Equipo Detectado: ${numeroPcDetectado}`;
        showStatus("✅ ¡Código de PC reconocido con éxito!", "success");
        btnEnviar.disabled = false; // Se activa el botón de enviar asistencia
      } else {
        throw new Error("Formato de código no válido");
      }
    } else {
      throw new Error("No se detectaron patrones alfanuméricos");
    }
  } catch (error) {
    showStatus("⚠️ No se leyó claramente el código (Ej: 26A). Enfocá bien la etiqueta blanca pegada al monitor e intentalo de nuevo.", "error");
    inputPc.value = "";
    btnEnviar.disabled = true;
  } finally {
    btnFoto.disabled = false;
  }
}

// --- ENVÍO DE DATOS Y BLOQUEO DEFINITIVO ---
async function enviarAsistencia() {
  const nombre = document.getElementById("alumno-nombre").value.trim();
  const btn = document.getElementById("btn-enviar");
  const container = document.getElementById("form-container");

  if (!nombre || !numeroPcDetectado) {
    showStatus("⚠️ Datos incompletos. Completá tu nombre y sacá la foto a la etiqueta.", "error");
    return;
  }

  btn.disabled = true;
  showStatus("⏳ Subiendo tu asistencia a la planilla de Google...", "info");

  try {
    const paqueteAsistencia = {
      nombreAlumno: nombre,
      numeroPC: numeroPcDetectado,
      ts: seguridadQR.s,
      token: seguridadQR.t
    };

    // Petición POST al Web App de Google Sheets
    await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(paqueteAsistencia)
    });

    // Guardamos el bloqueo diario en el LocalStorage
    const registroClave = "asistencia_enviada_" + new Date().toISOString().split('T')[0];
    localStorage.setItem(registroClave, "true");

    // Limpieza de interfaz: Muestra pantalla de cierre definitiva
    container.innerHTML = `
      <h2 style="color: var(--success);">🎉 Registro Finalizado</h2>
      <p>Tu asistencia fue guardada con éxito en Google Sheets. Ya podés cerrar esta pestaña y comenzar con la clase.</p>
    `;

  } catch (error) {
    showStatus("❌ Error de comunicación con el servidor. Revisá tu conexión e intentá de nuevo.", "error");
    btn.disabled = false;
  }
}

function showStatus(msg, tipo) {
  const box = document.getElementById("status-box");
  box.innerText = msg;
  box.style.display = "block";
  box.className = `status-msg status-${tipo}`;
}
</script>

</body>
</html>
