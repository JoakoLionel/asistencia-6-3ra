<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Asistencia - Alumno</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 90vh;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    h2 { margin-top: 0; color: #0f172a; font-size: 1.5rem; }
    p { color: #64748b; font-size: 0.95rem; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 0.9rem; }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    input:focus { outline: 2px solid var(--primary); }
    .btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
    .status-msg {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      display: none;
      font-weight: 500;
    }
    .status-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .status-success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .status-info { background: #e0f2fe; color: #0369a1; border: 1px solid #7dd3fc; }
  </style>
</head>
<body>

<div class="card" id="form-container">
  <h2>Validando acceso...</h2>
  <p>Esperá un momento mientras verificamos los tokens de seguridad.</p>
</div>

<script>
// !!! REEMPLAZÁ ESTO CON LA URL REAL DE TU GOOGLE APPS SCRIPT !!!
const APPS_SCRIPT_URL = "PONE_ACA_LA_URL_DE_TU_SCRIPT"; 

let seguridadQR = { t: null, s: null, g: null };

// Al cargar la página, extrae los parámetros de la URL de forma inmediata
window.onload = function() {
  const urlParams = new URLSearchParams(window.location.search);
  seguridadQR.t = urlParams.get('t');
  seguridadQR.s = urlParams.get('s');
  seguridadQR.g = urlParams.get('g');

  const container = document.getElementById("form-container");

  // Si falta alguna credencial en el enlace, bloquea el acceso
  if (!seguridadQR.t || !seguridadQR.s || !seguridadQR.g) {
    container.innerHTML = `
      <h2 style="color: #991b1b;">❌ Acceso Denegado</h2>
      <p>Para poder registrar tu presencia tenés que escanear el código QR dinámico que está proyectado en el aula.</p>
    `;
    return;
  }

  // Si los tokens existen, le muestra al alumno el formulario directo sin intermediarios
  container.innerHTML = `
    <h2>Registro de Asistencia</h2>
    <p>Ingresá tus datos para dar el presente en la materia actual.</p>
    
    <div class="form-group">
      <label for="alumno-nombre">Nombre y Apellido completo:</label>
      <input type="text" id="alumno-nombre" placeholder="Ej: Juan Pérez">
    </div>
    
    <div class="form-group">
      <label for="alumno-pc">Número de PC asignada:</label>
      <input type="number" id="alumno-pc" placeholder="Ej: 14" min="1">
    </div>
    
    <button class="btn" id="btn-enviar" onclick="enviarAsistencia()">Registrar Presente</button>
    <div id="status-box" class="status-msg"></div>
  `;
};

async function enviarAsistencia() {
  const nombre = document.getElementById("alumno-nombre").value.trim();
  const pc = document.getElementById("alumno-pc").value.trim();
  const btn = document.getElementById("btn-enviar");

  if (!nombre || !pc) {
    showStatus("⚠️ Por favor, completá tu nombre y el número de PC.", "error");
    return;
  }

  btn.disabled = true;
  showStatus("⏳ Enviando presente a la base de datos...", "info");

  try {
    const paqueteAsistencia = {
      nombreAlumno: nombre,
      numeroPC: pc,
      ts: seguridadQR.s,
      token: seguridadQR.t
    };

    // Envío de datos al Web App de Google Sheets
    await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(paqueteAsistencia)
    });

    // Éxito completo: Deshabilitamos el formulario
    document.getElementById("alumno-nombre").disabled = true;
    document.getElementById("alumno-pc").disabled = true;
    showStatus("🎉 ¡Presente guardado con éxito! Ya podés cerrar esta pestaña.", "success");

  } catch (error) {
    showStatus("❌ Error al conectar con el servidor. Intentá de nuevo.", "error");
    btn.disabled = false;
  }
}

function showStatus(msg, tipo) {
  const box = document.getElementById("status-box");
  box.innerText = msg;
  box.style.display = "block";
  box.className = `status-msg status-${tipo}`;
}
</script>

</body>
</html>
